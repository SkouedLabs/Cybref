[project]
name = "cybref"
version = "2.0.0"
description = "Automated mirror of cybersecurity reference datasets"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx[brotli]>=0.27",
    "lxml>=5",
    "pyyaml>=6",
    # Red Hat ships its CSAF VEX corpus as .tar.zst; 3.14 decodes it with the stdlib
    # (compression.zstd), older interpreters need the wheel.
    "zstandard>=0.23; python_version < '3.14'",
]

[project.scripts]
cybref = "cybref.__main__:main"
mcb = "mcb.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybref", "src/mcb"]
